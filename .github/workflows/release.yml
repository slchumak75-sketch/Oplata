name: Release

# Релиз создаётся автоматически при пуше тега вида v1.2.3:
#   git tag v0.1.0 && git push origin v0.1.0
# В релиз попадают: oplata.exe (единственный вариант приложения),
# zip с ним и SHA256SUMS.txt.
# Теги с суффиксом (v0.1.0-beta.1) помечаются как pre-release.
#
# Упрощение после v0.7.0: тесты и нативная Windows-сборка выполняются параллельно,
# а упаковка готового EXE делается на Linux (zip + sha256sum) без третьего Windows-runner.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Тесты ядра (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go vet ./...
      - run: go test ./...

  build-windows:
    name: Сборка oplata.exe (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Сборка
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" -o dist/oplata.exe ./cmd/oplata
          test -s dist/oplata.exe && head -c 2 dist/oplata.exe | grep -q MZ
      - uses: actions/upload-artifact@v7
        with:
          name: oplata-windows-amd64
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [test, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: oplata-*
          path: dist
          merge-multiple: true
      - name: ZIP-архив + контрольные суммы
        run: |
          set -euo pipefail
          test -s dist/oplata.exe
          zip_name="oplata-${GITHUB_REF_NAME}-windows-amd64.zip"
          echo "::notice title=release dist::oplata.exe"
          (cd dist && zip -9 "$zip_name" oplata.exe >/dev/null)
          (cd dist && sha256sum "$zip_name" oplata.exe > SHA256SUMS.txt)
          while IFS= read -r line; do echo "::notice title=sha256::$line"; done < dist/SHA256SUMS.txt
          ls -lh dist/
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Оплаты ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Что скачать

            | Файл | Что это |
            |---|---|
            | **oplata.exe** | Приложение «Оплаты»: открывает интерфейс в окне Edge/браузера. Установка не нужна — просто запустите. Флаги запуска: `-addr`, `-data`, `-portable`, `-no-open`, `-version` (подробности и журнал — в `oplata.log` рядом с данными). |
            | **oplata-…-windows-amd64.zip** | Тот же oplata.exe одним архивом. |

            Данные хранятся в `%AppData%\Oplata\data.json`. При первом запуске создаётся пустая база: встроенных сумм из Excel в программе нет. Существующий файл данных обновление не очищает; Excel при необходимости импортируется вручную на вкладке «Данные».
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
