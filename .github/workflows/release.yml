name: Release

# Релиз создаётся автоматически при пуше тега вида v1.2.3:
#   git tag v0.1.0 && git push origin v0.1.0
# В релиз попадают: oplata.exe, oplata-console.exe, oplata-desktop.exe,
# zip со всеми вариантами и SHA256SUMS.txt.
# Теги с суффиксом (v0.1.0-beta.1) помечаются как pre-release.
# Если сборка Wails-варианта упадёт, релиз всё равно выйдет с браузерным вариантом.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Тесты ядра (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go vet ./...
      - run: go test ./...

  build-windows:
    name: Браузерный вариант (oplata.exe)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Сборка
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" -o dist/oplata.exe ./cmd/oplata
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/oplata-console.exe ./cmd/oplata
          ./dist/oplata-console.exe -version
      - uses: actions/upload-artifact@v7
        with:
          name: oplata-windows-amd64
          path: dist/
          if-no-files-found: error

  build-desktop:
    name: Десктопный вариант Wails
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Сборка
        working-directory: desktop
        run: |
          go mod tidy
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" -o ../dist/oplata-desktop.exe .
      - uses: actions/upload-artifact@v7
        with:
          name: oplata-desktop-amd64
          path: dist/oplata-desktop.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build-windows, build-desktop]
    if: ${{ always() && needs.build-windows.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: oplata-*
          path: dist
          merge-multiple: true
      - name: ZIP-архив со всеми вариантами + контрольные суммы
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          Compress-Archive -Path dist/*.exe -DestinationPath ("dist/oplata-" + "${{ github.ref_name }}" + "-windows-amd64.zip")
          Get-ChildItem dist -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Оплаты ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Что скачать

            | Файл | Что это |
            |---|---|
            | **oplata.exe** | Основной вариант: открывает интерфейс в окне Edge/браузера. Установка не нужна — просто запустите. |
            | **oplata-desktop.exe** | Тот же интерфейс в отдельном окне Windows (нужен WebView2, есть в Windows 11). Может отсутствовать, если его сборка не удалась. |
            | **oplata-console.exe** | Тот же, что oplata.exe, но с консолью (диагностика, серверный режим, флаги `-addr`, `-data`, `-no-open`). |
            | **oplata-…-windows-amd64.zip** | Все варианты одним архивом. |

            Данные хранятся в `%AppData%\Oplata\data.json`. При первом запуске загружены стартовые данные из Excel за 2025 год (можно очистить на вкладке «Данные» или заменить импортом своего файла).
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
