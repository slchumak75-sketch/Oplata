name: Release

# Быстрый релиз по решению владельца: один Linux-job кросс-компилирует
# oplata.exe, упаковывает его и публикует GitHub Release.
# Тесты здесь не повторяются, а нативный Windows-runner не используется:
# тег разрешается ставить только на коммит main с уже зелёным CI.
# Теги с суффиксом (v0.1.0-beta.1) помечаются как pre-release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.25"

jobs:
  release:
    name: Сборка и публикация релиза (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Кросс-компиляция oplata.exe, ZIP и контрольные суммы
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${GITHUB_REF_NAME}" -o dist/oplata.exe ./cmd/oplata
          test -s dist/oplata.exe
          head -c 2 dist/oplata.exe | grep -q MZ
          zip_name="oplata-${GITHUB_REF_NAME}-windows-amd64.zip"
          echo "::notice title=release dist::oplata.exe"
          (cd dist && zip -9 "$zip_name" oplata.exe >/dev/null)
          (cd dist && sha256sum "$zip_name" oplata.exe > SHA256SUMS.txt)
          while IFS= read -r line; do echo "::notice title=sha256::$line"; done < dist/SHA256SUMS.txt
          ls -lh dist/
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Оплаты ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Что скачать

            | Файл | Что это |
            |---|---|
            | **oplata.exe** | Приложение «Оплаты»: открывает интерфейс в окне Edge/браузера. Установка не нужна — просто запустите. Флаги запуска: `-addr`, `-data`, `-portable`, `-no-open`, `-version` (подробности и журнал — в `oplata.log` рядом с данными). |
            | **oplata-…-windows-amd64.zip** | Тот же oplata.exe одним архивом. |

            Данные хранятся в `%AppData%\Oplata\data.json`. При первом запуске создаётся пустая база: встроенных сумм из Excel в программе нет. Существующий файл данных обновление не очищает; Excel при необходимости импортируется вручную на вкладке «Данные».
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
