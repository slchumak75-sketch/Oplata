name: Release

# Релиз создаётся автоматически при пуше тега вида v1.2.3:
#   git tag v0.1.0 && git push origin v0.1.0
# В релиз попадают: oplata.exe (единственный вариант приложения),
# zip с ним и SHA256SUMS.txt.
# Теги с суффиксом (v0.1.0-beta.1) помечаются как pre-release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Тесты ядра (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go vet ./...
      - run: go test ./...

  build-windows:
    name: Сборка oplata.exe (Windows)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Сборка
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" -o dist/oplata.exe ./cmd/oplata
          test -s dist/oplata.exe && head -c 2 dist/oplata.exe | grep -q MZ
      - uses: actions/upload-artifact@v7
        with:
          name: oplata-windows-amd64
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: oplata-*
          path: dist
          merge-multiple: true
      - name: ZIP-архив + контрольные суммы
        shell: pwsh
        run: |
          # Список файлов фиксируем ДО записи SHA256SUMS.txt и сам файл сумм исключаем:
          # иначе Get-ChildItem (стриминговый конвейер) может подобрать SHA256SUMS.txt,
          # пока Out-File его держит, и Get-FileHash упадёт по блокировке (релиз v0.1.0, 1-я попытка).
          $exe = @(Get-ChildItem dist -Filter *.exe -File)
          if ($exe.Count -eq 0) { echo "::error title=release::в dist нет ни одного exe"; Get-ChildItem dist -Recurse | ForEach-Object { echo "::error title=release dist::$($_.FullName)" }; exit 1 }
          echo "::notice title=release dist::$($exe.Name -join ', ')"
          Compress-Archive -Path $exe.FullName -DestinationPath ("dist/oplata-" + "${{ github.ref_name }}" + "-windows-amd64.zip")
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name)
          $lines = @($files | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name })
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          $lines | ForEach-Object { echo "::notice title=sha256::$_" }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Оплаты ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Что скачать

            | Файл | Что это |
            |---|---|
            | **oplata.exe** | Приложение «Оплаты»: открывает интерфейс в окне Edge/браузера. Установка не нужна — просто запустите. Флаги запуска: `-addr`, `-data`, `-portable`, `-no-open`, `-no-seed`, `-version` (подробности и журнал — в `oplata.log` рядом с данными). |
            | **oplata-…-windows-amd64.zip** | Тот же oplata.exe одним архивом. |

            Данные хранятся в `%AppData%\Oplata\data.json`. При первом запуске загружены стартовые данные из Excel за 2025 год (можно очистить на вкладке «Данные» или заменить импортом своего файла).
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
