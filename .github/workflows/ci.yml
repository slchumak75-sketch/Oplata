name: CI

# Сборка и тесты при каждом push и в pull request'ах.
# Артефакт (скачивается со страницы запуска во вкладке Actions):
#   - oplata-windows-amd64  : oplata.exe — единственный вариант приложения
#     (решение владельца от 2026-10-21: console- и Wails-варианты отброшены).
# Релизы по тегам v* делает .github/workflows/release.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Тесты ядра (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        run: |
          files=$(gofmt -l cmd pkg)
          if [ -n "$files" ]; then
            echo "Не отформатированы (gofmt -w):"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Экспорт XLSX открывается сторонним openpyxl и сверяется с оригиналом
        run: |
          # Вывод дублируем в аннотации: полные логи Actions не всегда доступны оператору.
          # set +e обязателен: шаги Actions запускаются с bash -e и оборвут вывод диагностики.
          set +e
          report_fail() { sed 's/^/::error title=verify-export::/' "$1" | head -40; }
          python3 -m pip install --quiet openpyxl > /tmp/pip.out 2>&1
          if [ $? -ne 0 ]; then python3 -m pip install --quiet --break-system-packages openpyxl >> /tmp/pip.out 2>&1; fi
          if [ $? -ne 0 ]; then pip3 install --quiet --break-system-packages openpyxl >> /tmp/pip.out 2>&1; fi
          if [ $? -ne 0 ]; then report_fail /tmp/pip.out; exit 1; fi
          go run ./tools/exportdemo /tmp/oplata-2025.xlsx > /tmp/export.out 2>&1
          if [ $? -ne 0 ]; then report_fail /tmp/export.out; exit 1; fi
          cat /tmp/export.out
          python3 tools/verify_export.py /tmp/oplata-2025.xlsx > /tmp/verify.out 2>&1; code=$?
          cat /tmp/verify.out
          if [ $code -ne 0 ]; then report_fail /tmp/verify.out; exit $code; fi
          echo "::notice title=verify-export::$(tail -1 /tmp/verify.out)"
      - name: Кросс-компиляция Windows (проверка, что собирается)
        run: |
          VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          echo "Версия: $VERSION"
          GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/oplata-check.exe ./cmd/oplata

  build-windows:
    name: Сборка oplata.exe (Windows)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Сборка oplata.exe
        run: |
          VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          echo "Версия: $VERSION"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$VERSION" -o dist/oplata.exe ./cmd/oplata
          ls -lh dist/
      - name: Проверка артефакта (PE-заголовок и размер)
        run: |
          test -s dist/oplata.exe
          head -c 2 dist/oplata.exe | grep -q MZ
      - uses: actions/upload-artifact@v7
        with:
          name: oplata-windows-amd64
          path: dist/
          if-no-files-found: error

