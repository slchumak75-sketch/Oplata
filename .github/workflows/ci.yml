name: CI

# Быстрый режим по решению владельца:
#   - чистые Markdown-изменения не запускают CI вовсе;
#   - один Linux-job без отдельного Windows-runner;
#   - Go-тесты — только при изменениях Go/go.mod/workflow, сборка EXE — только
#     при изменениях кода или встроенных GUI-ассетов;
#   - app.js проверяется node --check только если он изменён;
#   - сверка Excel через openpyxl — только при релевантных изменениях;
#   - устаревший запуск отменяется при новом коммите.
# Теги этот workflow не обслуживает: публикацией занимается release.yml.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  check:
    name: Быстрая проверка и oplata.exe (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Определить объём проверки
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          go_needed=false
          build_needed=false
          js_needed=false
          excel_needed=false

          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE_SHA"
          fi

          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="$(git -c core.quotePath=false diff --name-only "$base...HEAD")"
            echo "Изменённые файлы:"
            echo "$files"

            if [ -z "$files" ]; then
              go_needed=true
              build_needed=true
              js_needed=true
              excel_needed=true
            else
              if printf '%s\n' "$files" | grep -Eq '\.go$|^go\.mod$|^\.github/workflows/(ci|release)\.yml$'; then
                go_needed=true
              fi
              if printf '%s\n' "$files" | grep -Eq '\.go$|^go\.mod$|^cmd/|^pkg/|^\.github/workflows/(ci|release)\.yml$'; then
                build_needed=true
              fi
              if printf '%s\n' "$files" | grep -Eq '^pkg/webui/assets/app\.js$'; then
                js_needed=true
              fi
              if printf '%s\n' "$files" | grep -Eq '^(pkg/(excelio|model)/|tools/(exportdemo/|verify_export\.py$)|\.github/workflows/ci\.yml$|go\.mod$|Оплаты Строймаркет\.xlsx$)'; then
                excel_needed=true
              fi
            fi
          else
            # Ручной запуск или неизвестная база: безопасный полный объём.
            go_needed=true
            build_needed=true
            js_needed=true
            excel_needed=true
          fi

          {
            echo "go=$go_needed"
            echo "build=$build_needed"
            echo "js=$js_needed"
            echo "excel=$excel_needed"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=fast-ci::go=$go_needed build=$build_needed js=$js_needed excel=$excel_needed"
      - uses: actions/setup-go@v7
        if: steps.scope.outputs.go == 'true' || steps.scope.outputs.build == 'true' || steps.scope.outputs.excel == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        if: steps.scope.outputs.go == 'true'
        run: |
          files=$(gofmt -l cmd pkg)
          if [ -n "$files" ]; then
            echo "Не отформатированы (gofmt -w):"
            echo "$files"
            exit 1
          fi
      - name: go test
        if: steps.scope.outputs.go == 'true'
        run: go test ./...
      - name: Синтаксис app.js
        if: steps.scope.outputs.js == 'true'
        run: node --check pkg/webui/assets/app.js
      - name: Экспорт XLSX открывается сторонним openpyxl и сверяется с оригиналом
        if: steps.scope.outputs.excel == 'true'
        run: |
          # Вывод дублируем в аннотации: полные логи Actions не всегда доступны оператору.
          # set +e обязателен: шаги Actions запускаются с bash -e и оборвут вывод диагностики.
          set +e
          report_fail() { sed 's/^/::error title=verify-export::/' "$1" | head -40; }
          python3 -m pip install --quiet openpyxl > /tmp/pip.out 2>&1
          if [ $? -ne 0 ]; then python3 -m pip install --quiet --break-system-packages openpyxl >> /tmp/pip.out 2>&1; fi
          if [ $? -ne 0 ]; then pip3 install --quiet --break-system-packages openpyxl >> /tmp/pip.out 2>&1; fi
          if [ $? -ne 0 ]; then report_fail /tmp/pip.out; exit 1; fi
          go run ./tools/exportdemo /tmp/oplata-2025.xlsx "Оплаты Строймаркет.xlsx" > /tmp/export.out 2>&1
          if [ $? -ne 0 ]; then report_fail /tmp/export.out; exit 1; fi
          cat /tmp/export.out
          python3 tools/verify_export.py /tmp/oplata-2025.xlsx > /tmp/verify.out 2>&1; code=$?
          cat /tmp/verify.out
          if [ $code -ne 0 ]; then report_fail /tmp/verify.out; exit $code; fi
          echo "::notice title=verify-export::$(tail -1 /tmp/verify.out)"
      - name: Сборка oplata.exe (кросс-компиляция Windows)
        if: steps.scope.outputs.build == 'true'
        run: |
          VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          echo "Версия: $VERSION"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$VERSION" -o dist/oplata.exe ./cmd/oplata
          test -s dist/oplata.exe
          head -c 2 dist/oplata.exe | grep -q MZ
          ls -lh dist/
      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.build == 'true'
        with:
          name: oplata-windows-amd64
          path: dist/
          if-no-files-found: error
