<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оплаты поставщикам</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="brand-title">🧾 Оплаты</div>
    <div class="brand-sub" id="companyName">Строймаркет</div>
  </div>
  <nav class="tabs" id="mainTabs">
    <a href="#/dashboard" data-tab="dashboard">Сводка</a>
    <a href="#/matrix" data-tab="matrix">Таблица</a>
    <a href="#/suppliers" data-tab="suppliers">Поставщики</a>
    <a href="#/buyers" data-tab="buyers">Покупатели</a>
    <a href="#/operations" data-tab="operations">Операции</a>
    <a href="#/data" data-tab="data">Данные</a>
  </nav>
  <div class="header-actions">
    <button class="btn" id="btnSupplierCard">🏭 Карточка поставщика</button>
    <button class="btn" id="btnBuyerCard">🛒 Карточка покупателя</button>
    <button class="btn btn-primary" id="btnAddObligation">＋ Приход</button>
    <button class="btn btn-success" id="btnAddPayment">＋ Оплата</button>
  </div>
</header>

<div id="warnings" class="warnings hidden"></div>
<main id="view" class="view"><div class="loading">Загрузка…</div></main>

<footer class="app-footer">
  <span id="footerInfo"></span>
  <span class="muted">«Приход» — сумма к оплате за поставленный товар (дата = срок оплаты с учётом отсрочки). «Оплата» — фактически оплаченные суммы. Задолженность = Приход − Оплата.</span>
</footer>

<div id="modalRoot"></div>
<div id="toasts" class="toasts"></div>

<script src="app.js" defer></script>
</body>
</html>
